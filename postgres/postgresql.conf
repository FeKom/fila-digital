# ─────────────────────────────────────────────────────────────────────────────
# PostgreSQL instrumentation config — Fila Digital
#
# Mount this file into the container at /etc/postgresql/postgresql.conf and
# start postgres with: -c config_file=/etc/postgresql/postgresql.conf
#
# IMPORTANT: any change to shared_preload_libraries requires a full restart
# (not just reload). The extensions must be CREATE EXTENSION'd after restart.
# ─────────────────────────────────────────────────────────────────────────────

# ── Network ───────────────────────────────────────────────────────────────────
# Allow connections from any host (required when running inside Docker so the
# host can reach the container via the published port).
listen_addresses = '*'


# ── Extensions loaded at startup ─────────────────────────────────────────────
#
# pg_stat_statements: tracks execution statistics for every normalized query
#   (counts, total/mean/stddev duration, rows). Required for the
#   postgres_exporter custom queries and for identifying slow queries
#   without reading log files.
#
# auto_explain: logs the EXPLAIN ANALYZE plan of slow queries automatically,
#   without requiring manual EXPLAIN runs. Critical for diagnosing bad plans.
#
shared_preload_libraries = 'pg_stat_statements,auto_explain'


# ── pg_stat_statements ───────────────────────────────────────────────────────
#
# max: how many distinct normalized query fingerprints to track. When the
#   table is full, the least-recently-used entry is evicted. 10000 is
#   sufficient for most applications; increase if you have heavy dynamic SQL.
#
# track = all: instrument queries from all contexts — top-level statements,
#   functions, triggers, and utility commands (COPY, VACUUM, etc.).
#   Use 'top' if overhead becomes a concern in production.
#
pg_stat_statements.max = 10000
pg_stat_statements.track = all


# ── auto_explain ─────────────────────────────────────────────────────────────
#
# log_min_duration: log the plan for any query that takes longer than this
#   (milliseconds). 500ms is a reasonable threshold for dev/staging. In
#   production consider 1000ms or higher to avoid log volume explosion.
#   Set to 0 to log all queries (very noisy — dev only).
#
# log_analyze: run EXPLAIN ANALYZE (not just EXPLAIN) — includes actual rows
#   and actual timing per node. IMPORTANT: this re-executes the query for
#   EXPLAIN, adding overhead. Disable or use sample_rate < 1.0 in production.
#
# log_buffers: include buffer hit/miss statistics per plan node. Reveals
#   whether a slow query is I/O bound (lots of "read") or working from cache
#   ("shared hit"). Essential for diagnosing missing indexes vs cold cache.
#
# log_timing: per-node timing in the plan. Already implied by log_analyze
#   but explicit here for clarity.
#
# log_verbose: include schema-qualified object names and aliases in plans.
#   Makes it easier to match plan nodes to table/index definitions.
#
# log_nested_statements: also log plans for statements inside functions and
#   procedures. Without this, only top-level calls are logged.
#
auto_explain.log_min_duration = 500
auto_explain.log_analyze = on
auto_explain.log_buffers = on
auto_explain.log_timing = on
auto_explain.log_verbose = on
auto_explain.log_nested_statements = on


# ── Slow query logging ────────────────────────────────────────────────────────
#
# log_min_duration_statement: log any statement that takes longer than this
#   (milliseconds). Separate from auto_explain — this logs the query text and
#   duration; auto_explain additionally logs the plan.
#   100ms captures anything the application considers "suspicious".
#
log_min_duration_statement = 100


# ── Lock and contention logging ───────────────────────────────────────────────
#
# log_lock_waits: log when a session waits more than deadlock_detect_timeout
#   (default 1s) for a lock. Reveals lock contention between concurrent
#   transactions — e.g. two "call next" requests racing on the same row.
#
log_lock_waits = on


# ── Checkpoint logging ────────────────────────────────────────────────────────
#
# Checkpoints flush dirty pages to disk. Frequent checkpoints indicate
# write-heavy workloads. Each checkpoint log line shows buffers written,
# time elapsed, and whether it was a scheduled or forced checkpoint.
#
log_checkpoints = on


# ── Connection lifecycle ──────────────────────────────────────────────────────
#
# Useful for correlating pg_stat_activity entries with log lines, and for
# detecting connection leaks (no matching disconnect log after a connect).
#
log_connections = on
log_disconnections = on


# ── Temp file logging ─────────────────────────────────────────────────────────
#
# Temp files are created when a sort or hash cannot fit in work_mem.
# log_temp_files = 0 logs ALL temp file creations. This is a signal that
# work_mem is too low for the query workload. Increase the threshold value
# (in kB) to reduce noise if needed.
#
log_temp_files = 0


# ── Autovacuum logging ────────────────────────────────────────────────────────
#
# Log autovacuum runs that take longer than this (milliseconds). Dead tuples
# accumulate when rows are updated or deleted without being cleaned up.
# Excessive bloat degrades index performance and increases table size.
#
log_autovacuum_min_duration = 1000


# ── Log line prefix ───────────────────────────────────────────────────────────
#
# Adds structured context to every log line:
#   %t = timestamp
#   %p = process ID (correlate log lines from the same session)
#   %u = user
#   %d = database
#   %a = application_name (set from Node.js via pool config)
#   %h = client hostname/IP
#
# The application_name is especially useful: when the backend sets it to
# "fila-digital-api", every log line from a backend query includes it,
# making it easy to filter backend vs psql vs migration queries in Loki.
#
log_line_prefix = '%t [%p]: user=%u,db=%d,app=%a,client=%h '


# ── I/O timing ────────────────────────────────────────────────────────────────
#
# Enables per-I/O operation timing in pg_stat_io and EXPLAIN ANALYZE output.
# Minor overhead on most systems. Required to get meaningful "I/O time" in
# pg_stat_statements and auto_explain buffer reports.
#
track_io_timing = on


# ── Function tracking ─────────────────────────────────────────────────────────
#
# track_functions = pl: track call counts and total time for PL/pgSQL
# functions and procedures. Use 'all' to include SQL and C functions too.
#
track_functions = pl
