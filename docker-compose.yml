services:
  postgres:
    image: postgres:16-alpine
    command: ['-c', 'config_file=/etc/postgresql/postgresql.conf']
    environment:
      POSTGRES_DB: fila-digital
      POSTGRES_PASSWORD: '123321'
      POSTGRES_USER: 'fila-digital-user'
    ports:
      - 5435:5432
    restart: on-failure:3
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - app-network

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: 'postgresql://exporter_user:exporter_password@postgres:5432/fila-digital?sslmode=disable'
    command:
      - '--extend.query-path=/etc/postgres_exporter/queries'
      - '--collector.stat_bgwriter'
      - '--collector.stat_database'
      - '--collector.stat_user_tables'
    volumes:
      - ./postgres/queries:/etc/postgres_exporter/queries:ro
    ports:
      - 9187:9187
    networks:
      - app-network
    depends_on:
      - postgres

  redis:
    image: redis:alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - 6379:6379
    volumes:
      - redis-data:/data
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:latest
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
    ports:
      - 9090:9090
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - app-network
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  loki:
    image: grafana/loki:latest
    command: ['-config.file=/etc/loki/loki-config.yml']
    ports:
      - 3102:3100
    volumes:
      - ./observability/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - app-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ['--config=/etc/otel-collector-config.yml']
    ports:
      - 4317:4317   # OTLP gRPC
      - 4318:4318   # OTLP HTTP
      - 55679:55679 # zpages debug UI
    volumes:
      - ./observability/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    networks:
      - app-network
    depends_on:
      - jaeger
      - prometheus
      - loki

  jaeger:
    image: jaegertracing/jaeger:latest
    ports:
      - 16686:16686  # Jaeger UI
    networks:
      - app-network

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_DISABLE_LOGIN_FORM: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - 3100:3000
    volumes:
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/dashboards-provisioning:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - app-network
    depends_on:
      - prometheus
      - jaeger
      - loki

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
  loki-data:

networks:
  app-network:
    driver: bridge
