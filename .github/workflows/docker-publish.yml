name: Publish backend image

on:
  push:
    branches: [main, homolog]
    paths:
      - "apps/backend/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-backend

jobs:
  build-and-push:
    name: Build & push (arm64)
    # Runner ARM64 nativo — gratuito para repositórios públicos. O alvo é o
    # Ampere A1 da Oracle, também arm64, então não há emulação QEMU no meio.
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # OIDC do próprio GitHub: sem PAT de longa duração para gerenciar.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Contexto é a raiz do monorepo: o Dockerfile precisa do bun.lock e
          # dos package.json de todos os workspaces para o --frozen-lockfile.
          context: .
          file: apps/backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
