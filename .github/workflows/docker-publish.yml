name: Publish backend image

on:
  push:
    branches: [main, homolog]
    paths:
      - "apps/backend/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-backend

jobs:
  build-and-push:
    name: Build & push (arm64)
    # Os nós do cluster k3s na Oracle são amd64 (shapes E-series x86), não
    # Ampere ARM. Runner amd64 = build nativo, sem emulação.
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # OIDC do próprio GitHub: sem PAT de longa duração para gerenciar.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Contexto é a raiz do monorepo: o Dockerfile precisa do bun.lock e
          # dos package.json de todos os workspaces para o --frozen-lockfile.
          context: .
          file: apps/backend/Dockerfile
          # Precisa casar com a arquitetura dos nós: `kubectl get nodes -o wide`.
          # Imagem de arquitetura errada falha no pod com "exec format error".
          # Para publicar as duas, use: linux/amd64,linux/arm64 (exige o passo
          # docker/setup-qemu-action antes do buildx, e o build fica bem lento).
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
