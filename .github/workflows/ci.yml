name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BUN_VERSION: "1.4.0"

jobs:
  # ─── Backend ───────────────────────────────────────────────────────────────

  backend-validate:
    name: Backend — Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        working-directory: apps/backend
        run: bunx tsc --noEmit --skipLibCheck

      - name: Lint
        run: bun run --filter='@fila-digital/backend' lint

  backend-test:
    name: Backend — Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `controller.spec` é filtro POSICIONAL do vitest (casa por substring de
      # caminho) e seleciona só o teste unitário. O antigo --testPathPattern é
      # flag do Jest: o vitest aborta com "Unknown option", e por isso este job
      # nunca chegou a executar um teste.
      - name: Run unit tests
        working-directory: apps/backend
        run: bunx vitest run controller.spec --reporter=verbose

  # ─── Frontend ──────────────────────────────────────────────────────────────

  frontend-validate:
    name: Frontend — Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        working-directory: apps/frontend
        run: bunx tsc --noEmit --skipLibCheck

      - name: Lint
        run: bun run --filter='@fila-digital/frontend' lint

  frontend-test:
    name: Frontend — Component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run component tests
        run: bun run --filter='@fila-digital/frontend' test

  # ─── Build (main only) ─────────────────────────────────────────────────────

  build:
    name: Build all packages
    runs-on: ubuntu-latest
    needs: [backend-validate, backend-test, frontend-validate, frontend-test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build backend
        run: bun run --filter='@fila-digital/backend' build

      - name: Build frontend
        run: bun run --filter='@fila-digital/frontend' build
        env:
          NEXT_PUBLIC_FILA_DIGITAL_BASE_URL: ${{ secrets.NEXT_PUBLIC_FILA_DIGITAL_BASE_URL }}
