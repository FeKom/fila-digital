server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ─────────────────────────────────────────────────────────────
  # Docker containers — auto-discovered via Docker socket.
  # Each container gets labeled by its name and compose service.
  # ─────────────────────────────────────────────────────────────
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          # Only collect logs from containers that have this label set.
          # In docker-compose, add: labels: logging=promtail
          - name: label
            values: ["logging=promtail"]

    relabel_configs:
      # Use the Docker container name as the "container" label in Loki
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container

      # Use the compose service name (e.g. "api", "traefik") as "service"
      - source_labels:
          [__meta_docker_container_label_com_docker_compose_service]
        target_label: service

      # Use the compose project name as "project" (useful if you run
      # multiple compose stacks on the same VM)
      - source_labels:
          [__meta_docker_container_label_com_docker_compose_project]
        target_label: project

      # Carry through the custom job name set in the container label
      # (logging_jobname=fila-digital-api) — makes Grafana queries easier
      - source_labels:
          [__meta_docker_container_label_logging_jobname]
        target_label: job

      # Keep the full container ID for precise correlation
      - source_labels: [__meta_docker_container_id]
        target_label: container_id

    pipeline_stages:
      # ── JSON log parsing ─────────────────────────────────────
      # Pino outputs JSON. Extract the fields we care about so
      # Grafana can filter by level, requestId, etc.
      - json:
          expressions:
            level: level
            msg: msg
            time: time
            reqId: reqId
            err: err

      # Map numeric Pino levels to human-readable strings
      # so Grafana's log panel can colour-code them.
      - template:
          source: level
          template: |
            {{ if eq .Value "10" }}trace
            {{ else if eq .Value "20" }}debug
            {{ else if eq .Value "30" }}info
            {{ else if eq .Value "40" }}warn
            {{ else if eq .Value "50" }}error
            {{ else if eq .Value "60" }}fatal
            {{ else }}{{ .Value }}
            {{ end }}

      # Promote level and reqId to Loki labels so you can filter
      # with: {service="fila-digital-api", level="error"}
      - labels:
          level:
          reqId:

      # Use the log's own timestamp instead of the collection time
      - timestamp:
          source: time
          format: UnixMs
          action_on_failure: skip

      # Set the final log line to the "msg" field (cleaner in Grafana)
      # Falls back to the raw line if msg is empty (e.g. non-JSON logs)
      - output:
          source: msg

  # ─────────────────────────────────────────────────────────────
  # System logs — useful for auditing SSH access, OOM kills, etc.
  # ─────────────────────────────────────────────────────────────
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          host: oracle-vm
          __path__: /var/log/{syslog,auth.log,kern.log}

    pipeline_stages:
      # Parse syslog timestamp (e.g. "Jun 15 12:34:56")
      - regex:
          expression: '^(?P<timestamp>\w+\s+\d+\s+\d+:\d+:\d+)\s+(?P<hostname>\S+)\s+(?P<process>\S+):\s+(?P<message>.*)'

      - labels:
          hostname:
          process:

      - timestamp:
          source: timestamp
          format: "Jan _2 15:04:05"
          action_on_failure: skip

      - output:
          source: message
