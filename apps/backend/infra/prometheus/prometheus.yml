# ─────────────────────────────────────────────────────────────────────────────
# Prometheus configuration — Fila Digital
# ─────────────────────────────────────────────────────────────────────────────

global:
  scrape_interval: 15s       # How often to scrape targets
  evaluation_interval: 15s   # How often to evaluate alerting rules
  scrape_timeout: 10s
  external_labels:
    environment: "production"
    app: "fila-digital"

# ─────────────────────────────────────────────────────────────────────────────
# Alerting — point to Alertmanager if you add it later
# ─────────────────────────────────────────────────────────────────────────────
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

# ─────────────────────────────────────────────────────────────────────────────
# Rule files — load alerting / recording rules from separate files
# ─────────────────────────────────────────────────────────────────────────────
# rule_files:
#   - "/etc/prometheus/rules/*.yml"

# ─────────────────────────────────────────────────────────────────────────────
# Scrape configs
# ─────────────────────────────────────────────────────────────────────────────
scrape_configs:

  # Prometheus itself — always useful to monitor the monitor
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
    relabel_configs:
      - target_label: instance
        replacement: "prometheus"

  # ── Node.js API ─────────────────────────────────────────────────────────────
  # Requires @fastify/metrics (or prom-client) exposing GET /metrics
  # See: https://github.com/fastify/fastify-metrics
  - job_name: "fila-digital-api"
    scrape_interval: 10s
    static_configs:
      - targets: ["api:7070"]
        labels:
          service: "api"
    metrics_path: "/metrics"
    relabel_configs:
      - target_label: instance
        replacement: "fila-digital-api"

  # ── Traefik ─────────────────────────────────────────────────────────────────
  # Traefik exposes its own /metrics on port 8080 by default.
  # The docker-compose enables it via --metrics.prometheus=true
  - job_name: "traefik"
    scrape_interval: 15s
    static_configs:
      - targets: ["traefik:8080"]
        labels:
          service: "traefik"
    metrics_path: "/metrics"
    relabel_configs:
      - target_label: instance
        replacement: "traefik"

  # ── Redis ────────────────────────────────────────────────────────────────────
  # Redis does not expose Prometheus metrics natively.
  # Add redis_exporter as a sidecar in docker-compose.prod.yml:
  #
  #   redis-exporter:
  #     image: oliver006/redis_exporter:latest
  #     environment:
  #       REDIS_ADDR: "redis://redis:6379"
  #     networks:
  #       - internal
  #
  - job_name: "redis"
    scrape_interval: 15s
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: "redis"
    relabel_configs:
      - target_label: instance
        replacement: "redis"

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  # Same pattern as Redis — needs postgres_exporter as a sidecar:
  #
  #   postgres-exporter:
  #     image: prometheuscommunity/postgres-exporter:latest
  #     environment:
  #       DATA_SOURCE_NAME: "postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}?sslmode=disable"
  #     networks:
  #       - internal
  #
  - job_name: "postgres"
    scrape_interval: 30s
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: "postgres"
    relabel_configs:
      - target_label: instance
        replacement: "postgres"
