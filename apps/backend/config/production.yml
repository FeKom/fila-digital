server:
  port: 7070
logging:
  level: error
database:
  name: "postgres" # Supabase default database name
  host: "" # set via DATABASE_HOST env var
  user: "postgres" # Supabase default user
  password: "" # set via DATABASE_PASSWORD env var
  port: 6543 # Supabase connection pooler port (Transaction mode)
  ssl: true
  applicationName: "fila-digital-api"
  statementTimeoutMs: 5000 # 5s — abort runaway queries in production
  slowQueryThresholdMs: 500 # higher threshold in prod to reduce log noise
  connection:
    max: 10
    timeoutInMilli: 10000
    idleTimeoutInMilli: 60000
cache:
  url: ""  # set REDIS_URL in Render — e.g. rediss://default:<pw>@<host>.upstash.io:6379
  host: "" # alternative: set REDIS_HOST + REDIS_PORT if not using full URL
  port: 6379
  ttl: 3600
cors:
  allowedOrigin: "" # set via ALLOWED_ORIGIN env var — used in QR code URLs
token:
  secret: ""
notifications:
  resend:
    apiKey: ""
    fromEmail: "noreply@filadigital.app.br"
google:
  clientId: ""
vapid:
  subject: "" # set VAPID_SUBJECT e.g. mailto:contact@filadigital.app
  publicKey: "" # set VAPID_PUBLIC_KEY
  privateKey: "" # set VAPID_PRIVATE_KEY
otel:
  endpoint: ""
  serviceName: "fila-digital-api"
  lokiUrl: ""
