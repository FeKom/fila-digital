server:
  port: 7070
logging:
  level: error
database:
  name: "postgres" # Supabase default database name
  host: "" # set via DATABASE_HOST env var (db.<ref>.supabase.co or pooler host)
  user: "postgres" # Supabase default user
  password: "" # set via DATABASE_PASSWORD env var
  port: 6543 # Supabase connection pooler port (Transaction mode)
  ssl: true
  connection:
    max: 10
    timeoutInMilli: 10000
cache:
  host: ""
  port: 6379
  ttl: 3600
token:
  secret: ""
