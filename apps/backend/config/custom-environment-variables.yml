server:
  port: PORT
logging:
  level: LOG_LEVEL
database:
  name: DATABASE_NAME
  host: DATABASE_HOST
  user: DATABASE_USER
  password: DATABASE_PASSWORD
  port: DATABASE_PORT
  # __format: json faz o node-config parsear o valor em vez de tratar como
  # string. Sem isso, DATABASE_SSL=false chega como a string "false", que é
  # truthy em JS — só era possível LIGAR o SSL, nunca desligar. Quebra ao
  # apontar para um Postgres sem TLS (in-cluster).
  ssl:
    __name: DATABASE_SSL
    __format: json
  applicationName: DATABASE_APPLICATION_NAME
  statementTimeoutMs: DATABASE_STATEMENT_TIMEOUT_MS
  slowQueryThresholdMs: DATABASE_SLOW_QUERY_THRESHOLD_MS
  connection:
    max: DATABASE_CONNECTION_MAX
    timeoutInMilli: DATABASE_CONNECTION_TIMEOUT_IN_MILLI # fixed: was at wrong nesting level
    idleTimeoutInMilli: DATABASE_IDLE_TIMEOUT_IN_MILLI
cache:
  url: REDIS_URL   # full Upstash URL e.g. rediss://default:<pw>@<host>:6379
  host: REDIS_HOST # used when REDIS_URL is not set (local dev)
  port: REDIS_PORT
  ttl: REDIS_TTL
token:
  secret: AUTH_TOKEN
cors:
  allowedOrigin: ALLOWED_ORIGIN
notifications:
  resend:
    apiKey: RESEND_API_KEY
    fromEmail: NOTIFICATION_FROM_EMAIL
google:
  clientId: GOOGLE_CLIENT_ID
vapid:
  subject: VAPID_SUBJECT     # mailto:contact@yourdomain.com
  publicKey: VAPID_PUBLIC_KEY
  privateKey: VAPID_PRIVATE_KEY
otel:
  endpoint: OTEL_EXPORTER_OTLP_ENDPOINT
  serviceName: OTEL_SERVICE_NAME
  lokiUrl: LOKI_URL
s3:
  keyId: KEY_ID
  keyName: KEY_NAME
  applicationKey: APPLICATION_KEY
