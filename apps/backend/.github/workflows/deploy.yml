# ─────────────────────────────────────────────────────────────────────────────
# Fila Digital — CI/CD Pipeline
#
# Triggered on every push to `main`.
#
# Jobs:
#   test    → runs the full test suite (unit + integration via Testcontainers)
#   build   → builds the Docker image and pushes it to GHCR
#   deploy  → SSHs into the Oracle VM, pulls the new image and restarts the stack
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   VM_HOST        IP or hostname of the Oracle VM
#   VM_USER        SSH user (e.g. ubuntu or opc)
#   VM_SSH_KEY     Private SSH key whose public key is in ~/.ssh/authorized_keys on the VM
#   VM_DEPLOY_PATH Absolute path to the project on the VM (e.g. /home/ubuntu/fila-digital)
# ─────────────────────────────────────────────────────────────────────────────

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  # ghcr.io/<owner>/<repo> — resolved automatically from the repository context
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1 — Test
  # Runs on every push and every PR against main.
  # The build and deploy jobs only run after this passes.
  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Run tests
        run: yarn test:run
        env:
          NODE_ENV: test

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2 — Build & Push image to GHCR
  # Runs only on pushes to main (not on PRs) and only after tests pass.
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # Required for GHCR authentication with the automatic GITHUB_TOKEN
    permissions:
      contents: read
      packages: write

    outputs:
      # Pass the exact image digest to the deploy job so it pulls the right layer
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Enables building multi-platform images (linux/arm64 for Oracle Ampere A1)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generates tags:
      #   ghcr.io/<owner>/<repo>:latest
      #   ghcr.io/<owner>/<repo>:<short-sha>   (e.g. :a1b2c3d)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Build for the Oracle Ampere A1 ARM architecture.
          # Add linux/amd64 here if you also target x86 VMs.
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache stored in the GHCR — speeds up subsequent builds
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache,mode=max
          build-args: |
            GITHUB_SHA=${{ github.sha }}

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3 — Deploy to Oracle VM
  # SSHs into the VM, pulls the new image, and restarts the compose stack.
  # A failed deploy does NOT affect the image already in GHCR.
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production
      url: https://api.${{ vars.DOMAIN }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          # Conservative timeout — image pull on a free-tier VM can be slow
          command_timeout: 10m
          script: |
            set -euo pipefail

            cd ${{ secrets.VM_DEPLOY_PATH }}

            echo "==> Logging in to GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" \
              | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "==> Pulling new image..."
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull api

            echo "==> Restarting api service (zero-downtime: other services stay up)..."
            docker compose -f docker-compose.prod.yml --env-file .env.prod \
              up -d --no-deps --remove-orphans api

            echo "==> Running database migrations..."
            docker compose -f docker-compose.prod.yml --env-file .env.prod \
              exec -T api yarn migration:up

            echo "==> Removing dangling images to save disk space..."
            docker image prune -f

            echo "==> Deploy complete."

      - name: Notify Sentry of new release
        # Creates a Sentry "release" entry so errors are tagged to this deploy.
        # SENTRY_AUTH_TOKEN needs to be added as a GitHub secret.
        # Get it at: https://sentry.io/settings/account/api/auth-tokens/
        if: ${{ vars.SENTRY_ORG != '' }}
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        with:
          environment: production
          version: fila-digital@${{ github.sha }}
