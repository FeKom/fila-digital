# ─────────────────────────────────────────────────────────────────────────────
# Fila Digital — Production Stack
#
# Services:
#   cloudflared → Cloudflare Tunnel (no open ports needed on the VM)
#   traefik     → internal reverse proxy / router (HTTP only, no TLS)
#   api         → Node.js application
#   postgres    → database (internal network only)
#   redis       → cache (internal network only, 256 MB cap)
#   prometheus  → metrics scraping
#   grafana     → dashboards + alerts (replaces Datadog)
#   loki        → log aggregation (replaces ELK)
#   promtail    → log collector (reads Docker container logs → Loki)
#
# Networks:
#   proxy    → cloudflared + traefik + services that need a public URL
#   internal → database, cache, and observability (never exposed directly)
#
# How SSL works with Cloudflare Tunnel:
#   Internet → Cloudflare Edge (terminates HTTPS) → cloudflared (encrypted tunnel)
#   → Traefik (plain HTTP, port 80, never exposed to internet) → services
#   No ports need to be opened on the Oracle VM firewall.
#   No Let's Encrypt / ACME needed — Cloudflare handles all certificates.
#
# Usage:
#   cp .env.prod.example .env.prod
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ───────────────────────────────────────────────────────────
  # TUNNEL — Cloudflare Tunnel (cloudflared)
  #
  # Creates an outbound-only encrypted tunnel from this VM to
  # the Cloudflare edge. Zero inbound ports need to be opened.
  #
  # How to get CF_TUNNEL_TOKEN:
  #   1. Go to https://one.dash.cloudflare.com → Networks → Tunnels
  #   2. Create a tunnel, choose "Docker" as the connector
  #   3. Copy the token shown in the install command
  #   4. Add routes in the dashboard:
  #        api.<DOMAIN>       → http://traefik:80
  #        grafana.<DOMAIN>   → http://traefik:80
  #        traefik.<DOMAIN>   → http://traefik:80
  #        prometheus.<DOMAIN>→ http://traefik:80
  # ───────────────────────────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    networks:
      - proxy
    depends_on:
      - traefik

  # ───────────────────────────────────────────────────────────
  # REVERSE PROXY — Traefik (HTTP-only, internal routing)
  #
  # Cloudflare terminates TLS — Traefik only routes plain HTTP
  # between the tunnel and the internal services.
  # No ports are published to the host; cloudflared reaches
  # Traefik via the shared Docker "proxy" network.
  # Dashboard available via the tunnel at traefik.<DOMAIN>
  # ───────────────────────────────────────────────────────────
  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: unless-stopped
    command:
      # Docker provider — reads labels from containers automatically
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=proxy"
      # Single HTTP entrypoint — TLS is handled upstream by Cloudflare
      - "--entrypoints.web.address=:80"
      # Tell Traefik that requests arriving from Cloudflare are already HTTPS.
      # This ensures redirects and links generated by services use https://.
      - "--entrypoints.web.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22"
      # Prometheus metrics (scraped by the prometheus service on the internal network)
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.addentrypointslabelstohistograms=true"
      - "--metrics.prometheus.addserviceslabelstohistograms=true"
      # Dashboard (exposed via Traefik routing, protected by basic-auth middleware)
      - "--api.dashboard=true"
      - "--log.level=INFO"
      - "--accesslog=true"
    # No ports published — cloudflared reaches Traefik through the Docker network
    expose:
      - "80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      # Dashboard — protected with HTTP Basic Auth
      # Generate the hash: echo $(htpasswd -nB admin) | sed -e s/\\$/\\$\\$/g
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=web"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=basic-auth@docker"
      - "traefik.http.middlewares.basic-auth.basicauth.users=${TRAEFIK_BASIC_AUTH}"

  # ───────────────────────────────────────────────────────────
  # APPLICATION — Node.js API
  # ───────────────────────────────────────────────────────────
  api:
    image: ghcr.io/${GITHUB_REPOSITORY:-fila-digital/backend}:latest
    container_name: fila-digital-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${PORT:-7070}
      LOG_LEVEL: info
      # Database — points to the internal service name, never localhost
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_SSL: "false"
      DATABASE_CONNECTION_MAX: "10"
      # Cache — points to the internal service name
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TTL: "3600"
      # Auth
      AUTH_TOKEN: ${AUTH_TOKEN}
      # Sentry — leave empty to disable (SDK runs as no-op when DSN is unset)
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Injected by GitHub Actions so Sentry tags errors to the exact commit
      GITHUB_SHA: ${GITHUB_SHA:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.${DOMAIN}`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=${PORT:-7070}"
      # Rate limit at the proxy level (complement to app-level limits)
      - "traefik.http.routers.api.middlewares=api-ratelimit@docker"
      - "traefik.http.middlewares.api-ratelimit.ratelimit.average=200"
      - "traefik.http.middlewares.api-ratelimit.ratelimit.burst=50"
      # Log labels for Promtail
      - "logging=promtail"
      - "logging_jobname=fila-digital-api"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:${PORT:-7070}/healthcheck",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ───────────────────────────────────────────────────────────
  # DATABASE — PostgreSQL
  # Internal network only — never reachable from the internet.
  # ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "max_connections=50"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "maintenance_work_mem=128MB"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ───────────────────────────────────────────────────────────
  # CACHE — Redis
  # Internal network only.
  # maxmemory-policy allkeys-lru: evict least-recently-used keys
  # when the 256 MB cap is reached.
  # save "": disables RDB persistence (cache does not need it).
  # ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --loglevel warning
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ───────────────────────────────────────────────────────────
  # METRICS — Prometheus
  # Scrapes metrics from the API (/metrics), Traefik, and itself.
  # Config file: ./infra/prometheus/prometheus.yml
  # ───────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--storage.tsdb.retention.size=5GB"
      - "--web.enable-lifecycle"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.${DOMAIN}`)"
      - "traefik.http.routers.prometheus.entrypoints=web"
      - "traefik.http.routers.prometheus.middlewares=basic-auth@docker"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

  # ───────────────────────────────────────────────────────────
  # DASHBOARDS & ALERTS — Grafana
  # Replaces Datadog. Connects to Prometheus (metrics) and
  # Loki (logs). Available at https://grafana.<DOMAIN>
  # ───────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_SERVER_ROOT_URL: "https://grafana.${DOMAIN}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ALERTING_ENABLED: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - internal
      - proxy
    depends_on:
      - prometheus
      - loki
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  # ───────────────────────────────────────────────────────────
  # LOG AGGREGATION — Loki
  # Stores and indexes logs shipped by Promtail.
  # Queried directly by Grafana.
  # Config file: ./infra/loki/loki-config.yml
  # ───────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks:
      - internal

  # ───────────────────────────────────────────────────────────
  # LOG COLLECTOR — Promtail
  # Reads logs from all Docker containers and ships them to Loki.
  # Config file: ./infra/promtail/promtail-config.yml
  # ───────────────────────────────────────────────────────────
  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./infra/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
    networks:
      - internal
    depends_on:
      - loki

# ─────────────────────────────────────────────────────────────
# NETWORKS
# ─────────────────────────────────────────────────────────────
networks:
  # Services reachable via Traefik / Cloudflare Tunnel
  proxy:
    name: proxy
    driver: bridge

  # Services that must never be directly reachable from outside
  internal:
    name: internal
    driver: bridge
    internal: true

# ─────────────────────────────────────────────────────────────
# VOLUMES — all data persisted on the host block storage
# ─────────────────────────────────────────────────────────────
volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
  loki-data:
